<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="44" fill="#fff7f5"/>
  <circle cx="96" cy="96" r="64" fill="#ffd4c1" opacity="0.4"/>
  <g transform="translate(96,96)">
    <!-- 6 floral petals -->
    <ellipse cx="0" cy="-30" rx="16" ry="24" fill="#ef7a9a" opacity="0.9" />
    <ellipse cx="26" cy="-15" rx="16" ry="24" fill="#f2a3b5" opacity="0.9" transform="rotate(60, 26, -15)" />
    <ellipse cx="26" cy="15" rx="16" ry="24" fill="#ef7a9a" opacity="0.9" transform="rotate(120, 26, 15)" />
    <ellipse cx="0" cy="30" rx="16" ry="24" fill="#f2a3b5" opacity="0.9" transform="rotate(180, 0, 30)" />
    <ellipse cx="-26" cy="15" rx="16" ry="24" fill="#ef7a9a" opacity="0.9" transform="rotate(240, -26, 15)" />
    <ellipse cx="-26" cy="-15" rx="16" ry="24" fill="#f2a3b5" opacity="0.9" transform="rotate(300, -26, -15)" />
    <!-- Flower center -->
    <circle cx="0" cy="0" r="16" fill="#fff" />
    <circle cx="0" cy="0" r="11" fill="#5a2d4b" />
  </g>
</svg>

